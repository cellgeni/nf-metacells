$schema: https://raw.githubusercontent.com/nextflow-io/schemas/refs/heads/main/module/v1/schema.json
name: cellgeni/seacells
version: 2.0.0
kind: Process
description: >
  SEACells metacells from a precomputed embedding: a membership table (barcode,metacell) and a JSON summary with
  convergence, RSS and metacell sizes. The unified SEACells model runs on CPU and, when the task has an
  accelerator, on the device; ext.args `--use-sparse` selects the legacy sparse CPU backend. Exact ties in the
  embedding are jittered deterministically so the kNN graph cannot collapse.
keywords:
  - metacells
  - single-cell
  - seacells
  - gpu
  - aggregation
license: MIT
authors:
  - "@claptar"
maintainers:
  - "@claptar"
requires:
  nextflow: ">=26.10.6"
tools:
  - seacells:
      description: SEACells learns archetypal cellular states and aggregates cells into metacells.
      homepage: https://github.com/dpeerlab/SEACells
      documentation: https://seacells.readthedocs.io/
      license:
        - BSD-3-Clause
      identifier: biotools:SEACells
input:
  - - name: id
      type: string
      description: Item id; default output prefix.
    - name: adata
      type: file
      description: Base AnnData object, staged under input/; supplies the barcodes.
      pattern: "*.{h5ad,zarr}"
    - name: embedding
      type: file
      description: "Optional step output holding obsm/<embedding_key> (default: the base object)."
    - name: embedding_key
      type: string
      description: "Optional obsm key of the embedding (default: X_pca)."
    - name: output_prefix
      type: string
      description: Optional output prefix (default id).
output:
  - - name: id
      type: string
      description: Item id.
    - name: membership
      type: file
      description: "`<prefix>.membership.csv`: barcode,metacell (an empty metacell means unassigned)."
      pattern: "*.membership.csv"
    - name: summary
      type: file
      description: >
        `<prefix>.seacells.json`: converged, n_metacells, requested_metacells, metacell_size, rss, backend, gpu,
        jitter, seed and tool versions.
      pattern: "*.seacells.json"
topics:
  - - name: process
      type: string
      description: versions topic, the process name.
    - name: tool
      type: string
      description: versions topic, `SEACells`.
    - name: version
      type: string
      description: versions topic, the tool version.
