$schema: https://raw.githubusercontent.com/nextflow-io/schemas/refs/heads/main/module/v1/schema.json
name: cellgeni/hmetacells
version: 2.0.0
kind: Process
description: >
  Hierarchical metacells built within the groups of an obs column: a membership table (barcode,metacell) and a
  JSON summary. Each group's kNN graph of a precomputed embedding is cut by a scikit-network hierarchy (Louvain
  or Paris) into balanced clusters of at most n-max cells; the graph is built with scanpy on CPU and with
  rapids-singlecell when the task has an accelerator.
keywords:
  - metacells
  - single-cell
  - clustering
  - gpu
  - aggregation
license: MIT
authors:
  - "@claptar"
maintainers:
  - "@claptar"
requires:
  nextflow: ">=26.10.6"
tools:
  - scikit-network:
      description: Graph algorithms, including the Paris and Louvain hierarchies and balanced dendrogram cuts.
      homepage: https://scikit-network.readthedocs.io
      license:
        - BSD-3-Clause
  - scanpy:
      description: Single-cell analysis in Python; builds the kNN graph on CPU.
      homepage: https://scanpy.readthedocs.io
      license:
        - BSD-3-Clause
  - rapids-singlecell:
      description: GPU single-cell analysis; builds the kNN graph on the device.
      homepage: https://rapids-singlecell.readthedocs.io
      license:
        - MIT
input:
  - - name: id
      type: string
      description: Item id; default output prefix.
    - name: adata
      type: file
      description: Base AnnData object, staged under input/; supplies the barcodes and the grouping column.
      pattern: "*.{h5ad,zarr}"
    - name: embedding
      type: file
      description: "Optional step output holding the embedding (default: the base object)."
    - name: embedding_key
      type: string
      description: "Optional element key of the embedding (default: obsm/X_pca)."
    - name: output_prefix
      type: string
      description: Optional output prefix (default id).
output:
  - - name: id
      type: string
      description: Item id.
    - name: membership
      type: file
      description: "`<prefix>.membership.csv`: barcode,metacell (an empty metacell means unassigned)."
      pattern: "*.membership.csv"
    - name: summary
      type: file
      description: >
        `<prefix>.hmetacells.json`: n_cells, n_metacells, n_groups, unassigned, metacell_size, below_n_min,
        constrain_by, hierarchy, n_neighbors, n_min, n_max, gpu, seed and tool versions.
      pattern: "*.hmetacells.json"
topics:
  - - name: process
      type: string
      description: versions topic, the process name.
    - name: tool
      type: string
      description: versions topic, `scikit-network`.
    - name: version
      type: string
      description: versions topic, the tool version.
