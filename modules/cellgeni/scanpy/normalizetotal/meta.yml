$schema: https://raw.githubusercontent.com/nextflow-io/schemas/refs/heads/main/module/v1/schema.json
name: cellgeni/scanpy/normalizetotal
version: 1.0.0
kind: Process
description: >
  Normalises counts to the same total per cell into layers/normalized, with scanpy on CPU or rapids-singlecell on a
  GPU (task.accelerator). Writes a raw step directory, a slim object or a full copy (ext.output_mode).
keywords:
  - normalisation
  - anndata
  - scanpy
  - rapids-singlecell
  - gpu
  - single-cell
license: MIT
authors:
  - "@claptar"
maintainers:
  - "@claptar"
requires:
  nextflow: ">=26.10.6"
tools:
  - scanpy:
      description: Single-cell analysis in Python.
      homepage: https://scanpy.readthedocs.io
      license:
        - BSD-3-Clause
  - rapids-singlecell:
      description: GPU-accelerated single-cell analysis with RAPIDS.
      homepage: https://rapids-singlecell.readthedocs.io
      license:
        - MIT
input:
  - - name: id
      type: string
      description: Item id; default output prefix.
    - name: adata
      type: file
      description: Base AnnData object holding the counts, staged under input/.
      pattern: "*.{h5ad,zarr}"
    - name: counts_key
      type: string
      description: Optional element with the counts, `X` (default), `layers/<name>` or `raw/X`.
    - name: output_prefix
      type: string
      description: Optional output prefix (default id).
output:
  - - name: id
      type: string
      description: Item id.
    - name: normalized
      type: file
      description: >
        `<prefix>.normalizetotal.raw` (raw directory with layers/normalized and manifest.json) or
        `<prefix>.normalizetotal.h5ad|zarr` (slim or attach object).
      pattern: "*.normalizetotal.{raw,h5ad,zarr}"
topics:
  - - name: process
      type: string
      description: versions topic, the process name.
    - name: tool
      type: string
      description: versions topic, `scanpy` or `rapids-singlecell` (GPU).
    - name: version
      type: string
      description: versions topic, the tool version.
