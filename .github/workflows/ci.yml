name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: nextflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v3
        with:
          version: "26.10.7"
      - name: Lint pipeline, modules and configs
        run: nextflow lint -o concise .
      - name: Module copies of the shared Python helpers are in sync
        run: scripts/sync_shared.sh --check

  python:
    name: python tests
    runs-on: ubuntu-latest
    container: community.wave.seqera.io/library/python_pip_scanpy_anndata_pruned:a5329e1ed934ad90
    steps:
      - uses: actions/checkout@v7
      - name: Install pytest in the scanpy image
        run: pip install --no-cache-dir pytest==9.2.0
      - name: Test the shared I/O helper and the step scripts
        run: python -m pytest shared/python tests/python -q

  python-snapatac2:
    name: python tests (snapATAC2)
    runs-on: ubuntu-latest
    container: community.wave.seqera.io/library/python_pip_gcc_conda-gcc-specs_pruned:b8199b0e3c90fd81
    steps:
      - uses: actions/checkout@v7
      - name: Install pytest in the snapatac2 image
        run: pip install --no-cache-dir pytest==9.2.0
      - name: Test the snapATAC2 step scripts
        run: python -m pytest tests/python/test_snapatac2.py -q

  nf-test:
    name: module nf-tests (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v3
        with:
          version: "26.10.7"
      - uses: nf-core/setup-nf-test@v2
        with:
          version: "0.9.5"
      - name: Test the modules on CPU
        run: nf-test test modules/cellgeni --profile docker --ci

  stub:
    name: stub run (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [test, test_atac, test_paired, test_10x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: nf-core/setup-nextflow@v3
        with:
          version: "26.10.7"
      - name: Stub run of the test profile
        run: nextflow run . -profile ${{ matrix.profile }},docker -stub-run --outdir results
